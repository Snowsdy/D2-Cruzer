[package]
name = "cruzer-compagnon"
version = "0.0.3"
description = "All-in-one Destiny 2 companion"
authors = ["Snowsdy"]
edition = "2021"

[lib]
name = "cruzer_compagnon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.dev]
# Faster incremental builds: keep line tables for backtraces but skip full debug info
debug = "line-tables-only"
incremental = true
codegen-units = 256

[dependencies]
log = "0.4"
tauri = { version = "2.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-store = "2.1"
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }
tauri-plugin-updater = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-process = "2.0"
tauri-plugin-global-shortcut = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
quick-xml = { version = "0.36", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
] }
